<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnold's Order Form</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
  label { display: block; margin-top: 15px; font-weight: bold; }
  input[type="text"], input[type="email"], select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
  .checkbox-group { margin-top: 5px; }
  button { margin-top: 25px; padding: 12px; font-size: 16px; font-weight: bold; width: 100%; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
  button:hover { background-color: #45a049; }
</style>
</head>
<body>

<h2 style="text-align: center;">Place Your Arnold's Order 🍗</h2>

<form id="order-form" action="https://script.google.com/macros/s/AKfycbxVnYalaJOZzRDyqhjXLQsWmvVIvUv_RhZxuJ7C8cGmwIVBiNLuHsTwz-JlanEZJGVzrQ/exec" method="POST">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>

  <label for="main">Main Course:</label>
  <select id="main" name="main" required>
    <option value="" disabled selected>Select a main</option>
    <option value="1 Person Value Meal (2pc)">1 Person Value Meal (2pc)</option>
    <option value="1/2 Spring Plate">1/2 Spring Plate</option>
    <option value="Whole Spring Plate">Whole Spring Plate</option>
    <option value="Fish & Chips">Fish & Chips</option>
  </select>

  <label>Sides (Optional - Select multiple):</label>
  <div class="checkbox-group">
    <input type="checkbox" id="side1" name="sides" value="Coleslaw"> <label for="side1" style="display:inline; font-weight:normal;">Coleslaw</label><br>
    <input type="checkbox" id="side2" name="sides" value="Mashed Potato"> <label for="side2" style="display:inline; font-weight:normal;">Mashed Potato</label><br>
    <input type="checkbox" id="side3" name="sides" value="Potato Fries"> <label for="side3" style="display:inline; font-weight:normal;">Potato Fries</label><br>
    <input type="checkbox" id="side4" name="sides" value="Fried Bun"> <label for="side4" style="display:inline; font-weight:normal;">Fried Bun</label>
  </div>

  <label for="drink">Drink:</label>
  <select id="drink" name="drink">
    <option value="None">None</option>
    <option value="Bandung">Bandung</option>
    <option value="Iced Milo">Iced Milo</option>
    <option value="Sjora Mango Peach">Sjora Mango Peach</option>
    <option value="Iced Lemon Tea">Iced Lemon Tea</option>
  </select>

  <button type="submit">Submit Order</button>
</form>

</body>
</html>
